# nginx for the Docker image (README.md, "Docker"; docs/web-security.md): a read-only static
# site. It serves the browser build from /app/web and, when one is mounted, the Warblade data
# folder under /data/. It has no write API: every method but GET and HEAD gets 405. A separate
# account API, reached at /api/* through the reverse proxy, owns durable saves and scores.
#
# docker/entrypoint.sh writes the per-container parts into /tmp/warblade before starting it:
#   listen.conf       the port (PORT)
#   gamedata          a link to the folder holding warblade.pac (absent: no data mounted)
#   conf.d/*.conf     the trusted reverse proxies (WARBLADE_TRUSTED_PROXIES)

worker_processes 2;
pid /tmp/warblade/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/warblade/client_temp;
    proxy_temp_path /tmp/warblade/proxy_temp;
    fastcgi_temp_path /tmp/warblade/fastcgi_temp;
    uwsgi_temp_path /tmp/warblade/uwsgi_temp;
    scgi_temp_path /tmp/warblade/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript application/json;

    log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_user_agent" $request_time';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # ---- request size and timeouts ----
    # The static service accepts no request body (413 above 1 KiB, 405 for write methods).
    # The separate API has its own bounded request handling.
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    # Slow or idle clients are dropped instead of holding a connection.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # ---- concurrency and rate limits ----
    # Per client address (the real one when behind a trusted proxy: conf.d/realip.conf), and
    # for the whole server. Loading the game fetches the page, the game and every data file
    # (a few hundred requests, 6 at a time), so the burst is generous; a flood past it gets 429.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn_zone $server_name zone=conn_total:1m;
    limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=20r/s;
    limit_conn_status 429;
    limit_req_status 429;
    limit_conn conn_per_ip 32;
    limit_conn conn_total 1000;
    limit_req zone=req_per_ip burst=400 nodelay;

    include /tmp/warblade/conf.d/*.conf;

    server {
        include /tmp/warblade/listen.conf;
        server_name _;
        root /app/web;
        index index.html;
        autoindex off;
        absolute_redirect off;
        disable_symlinks on;

        # A read-only site: no PUT, DELETE, POST, OPTIONS, WebDAV...
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Every response, errors included. The page loads only its own files: no inline code,
        # nothing from other sites. 'wasm-unsafe-eval' lets it compile warblade.wasm.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), fullscreen=(self), gamepad=(self)" always;

        # Game data and authentication must not persist in browser caches.
        add_header Cache-Control "no-store" always;
        location / {
            try_files $uri $uri/index.html =404;
        }

        location = /loading-title.jpg {
            alias /tmp/warblade/loading-title.jpg;
            default_type image/jpeg;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The Warblade data, read-only. Directories list as JSON (autoindex, which leaves out
        # dot files) so the page can find the files; all files go out as plain bytes, so
        # nothing in the data folder can run as a page on this site.
        location ^~ /data/ {
            alias /tmp/warblade/gamedata/;
            disable_symlinks on from=/tmp/warblade/gamedata;
            autoindex on;
            autoindex_format json;
            types { }
            default_type application/octet-stream;

            location ~ /\. {
                return 404;
            }
        }

        location ~ /\. {
            return 404;
        }
    }
}
