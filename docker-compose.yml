# Local deployment: static game, private API, and a same-origin reverse proxy.
# Put your own Warblade 1.34 data under ./game/data before starting.
services:
  proxy:
    image: caddy:2.10-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./docker/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on: [warblade, api]
    read_only: true
    tmpfs: [/tmp, /config, /data]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  warblade:
    build: .
    image: warblade-sr
    volumes:
      - ./game/data:/data:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: warblade-sr-api
    environment:
      WARBLADE_PUBLIC_ORIGIN: http://localhost:8080
    volumes:
      - api-state:/state
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
volumes:
  api-state:
